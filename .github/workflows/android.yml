# Builds the Python Quest Android app on GitHub's servers and publishes it as a release.
# After each run, the newest APK is always at:
#   https://github.com/<your-name>/<repo>/releases/latest/download/python-quest.apk
name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm ci

      - name: Build the game and copy it into the Android project
        run: npm run sync

      - name: Unpack the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing key found."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, so this build uses a temporary debug key. Phones will refuse to update from it to a later build. Add the secrets from the README."
          fi

      - name: Build the APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        working-directory: android
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../python-quest.apk
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../python-quest.apk
          fi

      - name: Keep a copy with this run
        uses: actions/upload-artifact@v4
        with:
          name: python-quest-apk
          path: python-quest.apk

      - name: Publish as the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Python Quest ${{ env.VERSION_NAME }}
          body: Download python-quest.apk below and open it on your Android phone.
          files: python-quest.apk
          make_latest: true
